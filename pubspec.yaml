name: story_picker
description: Story-style capture flow for Flutter - camera, text stories, system media picker and preview.
version: 1.0.0-dev.1
homepage: https://github.com/noeGnh/story_picker
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  auto_size_text_field: ^2.3.0
  video_trimmer: ^5.0.0
  image_cropper: ^12.2.1
  file_picker: ^13.1.0
  camera: ^0.12.1
  path: ^1.9.1

  photofilters:
    git:
      url: https://github.com/noeGnh/photofilters.git
      ref: f48c58ae91292d7a871e197ae34e1bb493ef6173

  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.14.0

flutter:
  uses-material-design: true

