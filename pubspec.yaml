name: story_picker
description: Story-style capture flow for Flutter apps - full-screen camera, text stories, media picker, and photo and video editing.
version: 1.0.0
repository: https://github.com/noeGnh/story_picker
issue_tracker: https://github.com/noeGnh/story_picker/issues
topics:
  - camera
  - stories
  - image-editor
  - video-editor
  - media-picker

# The camera and the video editor are mobile only.
platforms:
  android:
  ios:

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  camera: ^0.12.1
  path: ^1.9.1
  pro_image_editor: ^14.6.1
  pro_video_editor: ^2.21.0
  video_player: ^2.14.0
  path_provider: ^2.1.6
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.14.0
  path_provider_platform_interface: ^2.1.2
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

